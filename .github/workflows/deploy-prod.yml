# ──────────────────────────────────────────────────────────────
# WORKFLOW: producción
# Trigger: push a main (viene de un PR desde staging)
# Qué hace: tests → PAUSA esperando aprobación manual → deploy
#
# La aprobación manual se configura en:
# GitHub → Settings → Environments → prod → Required reviewers
# ──────────────────────────────────────────────────────────────

name: 🚀 Deploy → PROD

on:
  push:
    branches: [main]

jobs:
  test:
    name: Tests finales
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests completos
        run: pytest tests/ -v --tb=long --cov=src --cov-fail-under=80

  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    needs: test
    environment: prod      # ← AQUÍ está la magia: GitHub pausa y pide aprobación
                           #   antes de ejecutar este job

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a PRODUCCIÓN
        run: |
          echo "══════════════════════════════════════════"
          echo "🚀 DEPLOY A PRODUCCIÓN APROBADO"
          echo "Entorno : PROD"
          echo "Rama    : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Actor   : ${{ github.actor }}"
          echo "══════════════════════════════════════════"

      # Deploy real (descomenta cuando tengas AWS configurado):
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: eu-north-1
      # - run: |
      #     zip -r function.zip src/ requirements.txt
      #     aws lambda update-function-code \
      #       --function-name cloudpy-demo-prod \
      #       --zip-file fileb://function.zip

      - name: Confirmar deploy en producción
        run: echo "✅ Producción actualizada — versión ${{ github.sha }}"
