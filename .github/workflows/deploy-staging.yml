      #     zip -r function.zip src/ requirements.txt
      #     aws lambda update-function-code \
      #       --function-name cloudpy-demo-staging \
      #       --zip-file fileb://function.zip

      - name: Confirmar deploy
        run: echo "🚀 Desplegado en STAGING correctamente"
