# ──────────────────────────────────────────────────────────────
# WORKFLOW: dev
# Trigger: cualquier push a la rama dev
# Qué hace: tests → si pasan, "despliega" al entorno DEV
# ──────────────────────────────────────────────────────────────

name: 🔧 Deploy → DEV

on:
  push:
    branches: [dev]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest tests/ -v --tb=short

  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    needs: test            # solo se ejecuta si los tests pasan
    environment: dev       # usa las variables/secrets del entorno "dev" en GitHub

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Simular deploy a DEV
        run: |
          echo "──────────────────────────────────────────"
          echo "✅ Tests pasados. Desplegando a DEV..."
          echo "Entorno : DEV"
          echo "Rama    : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Actor   : ${{ github.actor }}"
          echo "──────────────────────────────────────────"
          echo "APP_ENV=DEV" >> $GITHUB_ENV

      # Aquí iría el deploy real, por ejemplo:
      # - name: Deploy Lambda DEV
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: eu-north-1
      # - run: |
      #     zip -r function.zip src/ requirements.txt
      #     aws lambda update-function-code \
      #       --function-name cloudpy-demo-dev \
      #       --zip-file fileb://function.zip

      - name: Confirmar deploy
        run: echo "🚀 Desplegado en DEV correctamente"
